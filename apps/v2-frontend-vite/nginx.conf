server {
    # D4: unified frontend Service maps port 80 -> targetPort 3000.
    # Vite/nginx now listens on 3000 to match Next.js, so one Service
    # with one targetPort fronts both versions as version-labelled subsets.
    listen 3000;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # D5: frontend version stickiness.
        # This image IS v2, so it stamps the session as v2. Istio's
        # frontend VirtualService matches this cookie on every later
        # request and pins the whole session to the v2 (Vite) subset,
        # keeping the /assets/* tree coherent. `always` ensures the
        # header is set on static asset responses too, not just 2xx.
        add_header Set-Cookie "x-frontend=v2; Path=/; SameSite=Lax" always;
    }

    location /api/ {
        # Proxies to the unified backend Service name. The pod's Istio sidecar
        # intercepts this hop and matches the backend VirtualService by the
        # Host header, so Host MUST be the backend's name. Passing on the
        # browser's Host ($host = the public ALB name) matches no route, and
        # the call bypasses the backend weight split.
        proxy_pass http://ritual-roast-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host ritual-roast-backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
