# BACKEND CANARY - 10% to v2 (Go), 90% to v1 (Flask)
# Apply:  kubectl apply -f vs-backend-canary-10.yml
# Backend is stateless JSON -> pure weighted split is safe per-request.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-route
  namespace: dev
spec:
  hosts:
  - ritual-roast-backend
  http:
  - route:
    - destination: { host: ritual-roast-backend, subset: v1, port: { number: 5000 } }
      weight: 90
    - destination: { host: ritual-roast-backend, subset: v2, port: { number: 5000 } }
      weight: 10
