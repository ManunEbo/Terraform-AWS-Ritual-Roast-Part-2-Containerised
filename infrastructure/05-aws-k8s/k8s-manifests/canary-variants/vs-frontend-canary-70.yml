# FRONTEND CANARY - new sessions: 70% v2 (Vite), 30% v1 (Next.js)
# Rule 0 (/kiali) MUST stay first: cookie rules would otherwise capture it.
# Established sessions stay pinned by their x-frontend cookie (rules 1-2).
# Only the cookie-less ENTRY weight (rule 3) changes between steps.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-route
  namespace: dev
spec:
  hosts:
  - "*"
  gateways:
  - ritual-roast-gateway
  http:
  - match:
    - uri: { prefix: /kiali }
    route:
    - destination: { host: kiali.observability.svc.cluster.local, port: { number: 20001 } }
  - match:
    - headers: { cookie: { regex: ".*x-frontend=v1.*" } }
    route:
    - destination: { host: rr-frontend-svc, subset: v1, port: { number: 80 } }
  - match:
    - headers: { cookie: { regex: ".*x-frontend=v2.*" } }
    route:
    - destination: { host: rr-frontend-svc, subset: v2, port: { number: 80 } }
  - route:
    - destination: { host: rr-frontend-svc, subset: v1, port: { number: 80 } }
      weight: 30
    - destination: { host: rr-frontend-svc, subset: v2, port: { number: 80 } }
      weight: 70
