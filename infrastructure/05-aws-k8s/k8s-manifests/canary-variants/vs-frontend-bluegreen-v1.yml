# FRONTEND BLUE/GREEN -> v1. Clean rollback of a v2 flip: ALL traffic
# to v1, cookies ignored, so v2-cookied browsers are forced back to v1.
# Rule 0 (/kiali) only matches /kiali paths, so it does not weaken the rollback.
# Once stable, re-apply ../dev-apps/routing/istio-routing.yml to restore
# the normal cookie-sticky steady state (new v1 sessions re-acquire the
# v1 cookie naturally).
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-route
  namespace: dev
spec:
  hosts:
    - "*"
  gateways:
    - ritual-roast-gateway
  http:
    - match:
        - uri: { prefix: /kiali }
      route:
        - destination: { host: kiali.observability.svc.cluster.local, port: { number: 20001 } }
    - route:
        - destination: { host: rr-frontend-svc, subset: v1, port: { number: 80 } }
          weight: 100
