apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    # After Prometheus (wave 1) so Kiali can reach it on first startup
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: "https://kiali.org/helm-charts"
    chart: kiali-operator
    targetRevision: "2.28.0"
    helm:
      values: |
        # --- Operator pod placement ---
        # Prefer CP nodes so the operator stays off the app worker nodes.
        tolerations:
          - operator: Exists
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists

        # --- Kiali CR (operator reads this and deploys the Kiali server) ---
        cr:
          create: true
          namespace: "observability"
          spec:
            auth:
              strategy: "anonymous"

            external_services:
              prometheus:
                url: "http://prometheus-server.observability.svc.cluster.local"
              grafana:
                enabled: false
              tracing:
                enabled: false

            server:
              web_root: "/kiali"
              # MUST be quoted: the Kiali v2.28 CRD schema types web_port as a string.
              # An unquoted integer fails admission ("must be of type string") so the CR
              # is never created and the operator never deploys the Kiali server/Service.
              web_port: "20001"

            deployment:
              namespace: "observability"
              # Kiali server pod placement - also prefer CP nodes
              tolerations:
                - operator: Exists
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              ingress:
                enabled: false
              # Read-only dashboard: /kiali is reachable from the public ALB,
              # so no one can change Istio config or workloads from the UI.
              view_only_mode: true

            kiali_feature_flags:
              istio_injection_action: false

  destination:
    server: "https://kubernetes.default.svc"
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The kiali-operator rewrites the Kiali CR .spec with defaults, so ArgoCD sees it as
  # OutOfSync even though Kiali is Healthy and serving. We ignore .spec drift.
  # NOTE: use jqPathExpressions, NOT managedFieldsManagers — the Kiali CRD uses a loose
  # (preserve-unknown-fields) schema, and managedFieldsManagers forces schema-typed
  # normalization that errors with "field not declared in schema" (-> sync status
  # Unknown/ComparisonError). jq diffs raw JSON and sidesteps that. The operator remains
  # the source of truth for the CR's effective config; the seed is still applied on sync.
  ignoreDifferences:
    - group: kiali.io
      kind: Kiali
      jqPathExpressions:
        - ".spec"
