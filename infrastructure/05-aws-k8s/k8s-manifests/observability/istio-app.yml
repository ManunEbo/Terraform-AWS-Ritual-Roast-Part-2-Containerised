# 1. Istio Base (CRDs)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: base
    targetRevision: 1.30.1 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # istiod (field manager "pilot-discovery") mutates this ValidatingWebhookConfiguration
  # at runtime — caBundle plus other webhook fields — which the chart ships as defaults,
  # causing a permanent benign OutOfSync. Ignore everything istiod manages on it.
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    managedFieldsManagers:
    - pilot-discovery

---
# 2. Istio Control Plane (istiod)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: istiod
    targetRevision: 1.30.1 # SYNCHRONIZED
    helm:
      values: |
        # Pin istiod onto a frontend worker, OFF the untainted control-plane node,
        # so it cannot starve etcd / ArgoCD on the small CP instance.
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "frontend"
            effect: "NoSchedule"
        nodeSelector:
          tier: frontend
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # Same benign runtime mutation as istio-base — istiod ("pilot-discovery") owns this
  # validating webhook's fields post-sync. Ignore everything it manages.
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    managedFieldsManagers:
    - pilot-discovery

---
# 3. Istio Ingress Gateway (The Front Door)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: gateway
    targetRevision: 1.30.1 
    helm:
      values: |
        # Anchoring Istio to the DMZ Frontend Workers
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "frontend"
            effect: "NoSchedule"
        nodeSelector:
          tier: frontend
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 256Mi
        service:
          type: NodePort
          ports:
            # RESTORED: Istio internal health check port
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
            # THE BRIDGE: HTTP traffic port
            - name: http2
              port: 80
              targetPort: 80
              nodePort: 30080
            # OPTIONAL: HTTPS traffic port
            - name: https
              port: 443
              targetPort: 443
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true