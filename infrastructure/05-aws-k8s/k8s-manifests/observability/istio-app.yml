# 1. Istio Base (CRDs)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: base
    targetRevision: 1.30.1 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# 2. Istio Control Plane (istiod)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: istiod
    targetRevision: 1.30.1 # SYNCHRONIZED
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# 3. Istio Ingress Gateway (The Front Door)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    chart: gateway
    targetRevision: 1.30.1 
    helm:
      values: |
        # Anchoring Istio to the DMZ Frontend Workers
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "frontend"
            effect: "NoSchedule"
        nodeSelector:
          tier: frontend
        service:
          type: NodePort
          ports:
            # RESTORED: Istio internal health check port
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
            # THE BRIDGE: HTTP traffic port
            - name: http2
              port: 80
              targetPort: 80
              nodePort: 30080
            # OPTIONAL: HTTPS traffic port
            - name: https
              port: 443
              targetPort: 443
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true