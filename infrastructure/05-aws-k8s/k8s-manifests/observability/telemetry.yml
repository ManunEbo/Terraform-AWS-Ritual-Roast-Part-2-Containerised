apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy-agent
  namespace: observability
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      # THE FIX: Tolerate ALL taints so the agent runs on every node
      tolerations:
        - operator: "Exists"
      containers:
      - name: alloy
        image: grafana/alloy:latest
        env:
        - name: GRAFANA_CLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: grafana-auth
              key: bearer-token
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi