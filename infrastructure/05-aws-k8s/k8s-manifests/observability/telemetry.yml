# =================================================================
# GRAFANA ALLOY TELEMETRY - Ritual Roast v2
# =================================================================
# Alloy DaemonSet (one pod per node), remote-writes to Grafana Cloud.
# No local Prometheus -> no OOM risk on the t3.medium nodes.
#
# Scrape jobs (TRIMMED 2026-07-02 to stay under the Grafana Cloud ingestion
# rate limit — the full set was hitting HTTP 429 err-mimir-tenant-max-ingestion-rate):
#   1. App sidecars        (dev)            port 15020 /stats/prometheus
#   2. Ingress gateway      (istio-ingress) port 15020 /stats/prometheus
# A prometheus.relabel filter keeps ONLY istio_* (+ up) series and drops the
# thousands of raw Envoy stats each proxy emits — that is the bulk of the volume.
# Interval is 30s. The former job 3 (annotated pods, any ns) and job 4 (node
# cAdvisor) were removed: high-cardinality and not Istio. Re-add selectively if
# you later need node/OOM visibility, but watch the 1500 samples/s tenant limit.
#
# Jobs 1+2 populate the Istio dashboards and make the canary split visible:
# istio_requests_total{destination_version=...}. The gateway scrape (job 2)
# gives the edge-level frontend split; the sidecar scrape (job 1) gives backend
# split + per-pod inbound.
#
# BEFORE DEPLOY: user_data_cp.sh substitutes the two placeholders via
# sed at node boot, sourced from Terraform vars:
#   export TF_VAR_grafana_remote_write_url="https://prometheus-prod-XX-..."
#   export TF_VAR_grafana_instance_id="123456"
# Values: grafana.com -> your org -> Details on the Prometheus tile.
# =================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    // ---------- REMOTE WRITE: Grafana Cloud ----------
    prometheus.remote_write "grafana_cloud" {
      endpoint {
        url = env("GRAFANA_REMOTE_WRITE_URL")
        basic_auth {
          username = env("GRAFANA_INSTANCE_ID")
          password = env("GRAFANA_CLOUD_TOKEN")
        }
      }
      external_labels = {
        cluster = "ritual-roast-dev",
        env     = "dev",
      }
    }

    // ---------- METRIC FILTER: keep only Istio mesh series ----------
    // Envoy's /stats/prometheus exposes thousands of series per proxy; the Istio
    // dashboards and the canary split only need the istio_* family. Keeping just
    // those (plus `up` for target health) is the single biggest cut in sample
    // volume and is what brings us under the Grafana Cloud 1500 samples/s limit.
    // Both scrape jobs forward here instead of straight to remote_write.
    prometheus.relabel "istio_only" {
      forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      rule {
        source_labels = ["__name__"]
        action = "keep"
        regex  = "istio_.*|up"
      }
    }

    // ---------- JOB 1: APP SIDECARS (dev) ----------
    // Pods with an injected Envoy sidecar expose mesh metrics on 15020.
    discovery.kubernetes "sidecar_pods" {
      role = "pod"
      namespaces { names = ["dev"] }
    }
    discovery.relabel "sidecar_pods" {
      targets = discovery.kubernetes.sidecar_pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_sidecar_istio_io_status"]
        action = "keep"
        regex  = ".+"
      }
      rule {
        source_labels = ["__address__"]
        action = "replace"
        regex  = "([^:]+)(?::\\d+)?"
        replacement = "$1:15020"
        target_label = "__address__"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_version"]
        target_label = "version"
      }
    }
    prometheus.scrape "sidecar_pods" {
      targets = discovery.relabel.sidecar_pods.output
      scrape_interval = "30s"
      metrics_path = "/stats/prometheus"
      forward_to = [prometheus.relabel.istio_only.receiver]
    }

    // ---------- JOB 2: INGRESS GATEWAY (istio-ingress) ----------
    // The gateway pod IS an Envoy but is NOT sidecar-annotated, so it
    // needs its own scrape. Selected by the istio=ingressgateway label.
    // This gives the edge view of the FRONTEND v1/v2 split.
    discovery.kubernetes "gateway_pods" {
      role = "pod"
      namespaces { names = ["istio-ingress"] }
    }
    discovery.relabel "gateway_pods" {
      targets = discovery.kubernetes.gateway_pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_label_istio"]
        action = "keep"
        regex  = "ingressgateway"
      }
      rule {
        source_labels = ["__address__"]
        action = "replace"
        regex  = "([^:]+)(?::\\d+)?"
        replacement = "$1:15020"
        target_label = "__address__"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
    }
    prometheus.scrape "gateway_pods" {
      targets = discovery.relabel.gateway_pods.output
      scrape_interval = "30s"
      metrics_path = "/stats/prometheus"
      forward_to = [prometheus.relabel.istio_only.receiver]
    }

    // JOB 3 (annotated pods, any ns) and JOB 4 (node cAdvisor) were removed
    // 2026-07-02 to stay under the Grafana Cloud ingestion rate limit. They were
    // high-cardinality and not Istio metrics. Re-add selectively if needed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy-agent
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: alloy
      tolerations:
        - operator: "Exists"   # run on every node, including tainted ones
      containers:
      - name: alloy
        image: grafana/alloy:v1.3.1   # pinned (was :latest)
        args:
          - run
          - /etc/alloy/config.alloy
          - --storage.path=/tmp/alloy
        env:
        - name: GRAFANA_CLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: grafana-auth
              key: bearer-token
        - name: GRAFANA_REMOTE_WRITE_URL
          valueFrom:
            secretKeyRef:
              name: grafana-auth
              key: remote-write-url
        - name: GRAFANA_INSTANCE_ID
          valueFrom:
            secretKeyRef:
              name: grafana-auth
              key: instance-id
        volumeMounts:
        - name: alloy-config
          mountPath: /etc/alloy
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: alloy-config
        configMap:
          name: alloy-config
