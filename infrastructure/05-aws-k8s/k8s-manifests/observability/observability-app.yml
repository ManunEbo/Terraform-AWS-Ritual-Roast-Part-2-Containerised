apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-stack
  namespace: argocd
spec:
  project: default
  source:
    # REPLACE WITH YOUR ACTUAL GITHUB REPO URL
    repoURL: 'https://github.com/ManunEbo/Terraform-AWS-Ritual-Roast-Part-2-Containerised.git'
    targetRevision: main
    # This points ArgoCD to the folder containing telemetry.yml
    path: infrastructure/05-aws-k8s/k8s-manifests/observability
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true