apiVersion: apps/v1
kind: Deployment
metadata:
  name: v1-frontend-nextjs
  namespace: dev
  labels:
    app: rr-frontend-nextjs
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rr-frontend-nextjs
      version: v1
  template:
    metadata:
      labels:
        app: rr-frontend-nextjs
        version: v1
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "frontend"
          effect: "NoSchedule"
      nodeSelector:
        tier: frontend
      containers:
      - name: nextjs-frontend
        image: ghcr.io/manunebo/rr-v1-frontend:latest
        ports:
        - containerPort: 3000
        # =========================================================================
        # MODIFIED HERE: Passing the exact variable the ECS-built image expects
        # =========================================================================
        env:
        - name: BACKEND_URL
          value: "http://rr-backend-flask-svc:80"
        # =========================================================================
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi