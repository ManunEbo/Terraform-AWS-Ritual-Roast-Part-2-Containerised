apiVersion: apps/v1
kind: Deployment
metadata:
  name: v1-backend-flask
  namespace: dev
  labels:
    app: rr-backend-flask
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rr-backend-flask
      version: v1
  template:
    metadata:
      labels:
        app: rr-backend-flask
        version: v1
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "backend"
          effect: "NoSchedule"
      nodeSelector:
        tier: backend
      containers:
      - name: flask-backend
        image: ghcr.io/manunebo/rr-v1-backend:latest
        ports:
        - containerPort: 5000
        # =========================================================
        # PROXY: Pulls from the Terraform-generated ConfigMap
        # =========================================================
        envFrom:
        - configMapRef:
            name: backend-config
        # =========================================================
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi