# =================================================================
# ISTIO ROUTING - Ritual Roast v2  (STEADY STATE: 100% v1, 0% v2)
# =================================================================
# This is the GitOps-synced baseline (ArgoCD ritual-roast-workloads
# syncs dev-apps/ recursively). It defines the Gateway, both
# DestinationRules, and both VirtualServices at their resting weights.
#
# DO NOT put canary step files in this folder - two files defining the
# same-named VirtualService would collide under recursive sync. Step
# files live in ../../canary-variants/ and are applied by hand during a
# live session (see that folder's README).
#
# Cookie note (frontend): each frontend image stamps its own
# x-frontend cookie (v1=Next.js, v2=Vite). The VirtualService matches
# that cookie FIRST so an established session always returns to the
# same version; only NEW (cookie-less) sessions hit the weighted entry.
# The cookie regex assumes v1/v2 are distinct, non-substring tokens.
# =================================================================

# -----------------------------------------------------------------
# 1. GATEWAY  (unchanged - port 80 is the gateway SERVICE port, which
#    the ingress gateway Service maps from nodePort 30080; do NOT
#    change this to 30080)
# -----------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: ritual-roast-gateway
  namespace: dev
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
# -----------------------------------------------------------------
# 2a. DESTINATION RULE - Frontend subsets by version label
# -----------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: frontend-destination-rule
  namespace: dev
spec:
  host: rr-frontend-svc
  subsets:
  - name: v1
    labels:
      version: v1          # selects v1-frontend-nextjs pods
  - name: v2
    labels:
      version: v2          # selects v2-frontend-vite pods
---
# -----------------------------------------------------------------
# 2b. DESTINATION RULE - Backend subsets by version label
# -----------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend-destination-rule
  namespace: dev
spec:
  host: ritual-roast-backend
  subsets:
  - name: v1
    labels:
      version: v1          # selects v1-backend-flask pods
  - name: v2
    labels:
      version: v2          # selects v2-backend-go pods
---
# -----------------------------------------------------------------
# 3a. VIRTUAL SERVICE - Frontend (ingress -> frontend)
#     Rule order matters: cookie matches must come BEFORE the
#     weighted entry, or established sessions would be re-split.
# -----------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-route
  namespace: dev
spec:
  hosts:
  - "*"
  gateways:
  - ritual-roast-gateway
  http:
  # (0) Kiali UI — MUST be the FIRST rule. A browser that has loaded the app
  #     carries an x-frontend cookie; if the cookie matches below are reached
  #     first, they capture /kiali and route it to the frontend app -> 404
  #     (v1) or the wrong SPA (v2). Within one VirtualService rules are ordered
  #     top-down, so a first-position /kiali prefix always wins regardless of
  #     cookies. Covers the whole prefix: UI + assets + /kiali/api. This lives
  #     here (not a separate VirtualService) because two VSes on the same
  #     gateway+host merge with non-deterministic cross-VS ordering.
  - match:
    - uri:
        prefix: /kiali
    route:
    - destination:
        host: kiali.observability.svc.cluster.local
        port:
          number: 20001
  # (1) Established v1 session -> always v1
  - match:
    - headers:
        cookie:
          regex: ".*x-frontend=v1.*"
    route:
    - destination:
        host: rr-frontend-svc
        subset: v1
        port:
          number: 80
  # (2) Established v2 session -> always v2
  - match:
    - headers:
        cookie:
          regex: ".*x-frontend=v2.*"
    route:
    - destination:
        host: rr-frontend-svc
        subset: v2
        port:
          number: 80
  # (3) New session (no cookie) -> weighted entry. STEADY STATE = 100/0.
  #     Canary changes ONLY these two weights (via ../../canary-variants/).
  - route:
    - destination:
        host: rr-frontend-svc
        subset: v1
        port:
          number: 80
      weight: 50
    - destination:
        host: rr-frontend-svc
        subset: v2
        port:
          number: 80
      weight: 50
---
# -----------------------------------------------------------------
# 3b. VIRTUAL SERVICE - Backend (mesh-internal: frontend -> backend)
#     No gateway: this governs in-cluster calls. The frontend pod's
#     sidecar intercepts the call to ritual-roast-backend:5000 because
#     the dev namespace has istio-injection=enabled.
#
#     Stateless JSON API -> no cookie needed; pure weighted split is
#     safe per-request. STEADY STATE = 100/0.
# -----------------------------------------------------------------
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-route
  namespace: dev
spec:
  hosts:
  - ritual-roast-backend
  http:
  - route:
    - destination:
        host: ritual-roast-backend
        subset: v1
        port:
          number: 5000
      weight: 50
    - destination:
        host: ritual-roast-backend
        subset: v2
        port:
          number: 5000
      weight: 50
