# 1. The Gateway (Opens Istio's door inside the cluster)
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: ritual-roast-gateway
  namespace: dev
spec:
  selector:
    # This automatically targets the istio-ingressgateway pods
    istio: ingressgateway 
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*" # Accepts all traffic originating from the AWS ALB

---
# 2. The VirtualService (The Routing Logic)
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: frontend-route
  namespace: dev
spec:
  hosts:
  - "*"
  gateways:
  - ritual-roast-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        # ALIGNED: Exactly matches your Service metadata.name
        host: rr-frontend-nextjs-svc 
        port:
          # ALIGNED: Exactly matches your Service port (not targetPort)
          number: 80