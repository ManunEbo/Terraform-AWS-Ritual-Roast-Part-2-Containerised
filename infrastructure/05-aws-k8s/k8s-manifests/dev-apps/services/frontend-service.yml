apiVersion: v1
kind: Service
metadata:
  name: rr-frontend-svc
  namespace: dev
  # D4: single frontend Service fronting BOTH versions.
  # Next.js listens on 3000; Vite rebuilt to listen on 3000 -> one targetPort.
  # selector is app-only; DestinationRule splits v1/v2 by `version` subset.
spec:
  selector:
    app: rr-frontend         # matches both v1 Next.js and v2 Vite pods
  ports:
    - name: http             # named port REQUIRED for Istio L7 routing
      protocol: TCP
      port: 80               # gateway/VirtualService target this port
      targetPort: 3000       # both frontends listen on 3000
