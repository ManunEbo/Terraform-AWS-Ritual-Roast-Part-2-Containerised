version: 0.1
# Layer 4: ECS/Fargate + internal ALB + interface endpoints.
# Fargate cost comes from the task definition (vCPU/memory x desired_count) - no usage entry needed.
resource_type_default_usage:
  aws_lb:                       # the internal ALB
    new_connections: 50
    active_connections: 50
    processed_bytes_gb: 1000
  aws_vpc_endpoint:
    monthly_data_processed_gb: 500
