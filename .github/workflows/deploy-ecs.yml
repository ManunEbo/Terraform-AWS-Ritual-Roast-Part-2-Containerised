name: Build and Push V1 to AWS ECR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/v1-frontend-nextjs/**'
      - 'apps/v1-backend-flask/**'
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # STEP 1: Detect exactly which V1 apps changed
  # ==========================================
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      v1_frontend: ${{ steps.filter.outputs.v1_frontend }}
      v1_backend: ${{ steps.filter.outputs.v1_backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            v1_frontend: 'apps/v1-frontend-nextjs/**'
            v1_backend: 'apps/v1-backend-flask/**'

  # ==========================================
  # STEP 2: Build ONLY what changed
  # ==========================================
  build-v1-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.v1_frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/rr-dev-github-frontend-role
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build and Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rr-dev-frontend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./apps/v1-frontend-nextjs
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

  build-v1-backend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.v1_backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/rr-dev-github-backend-role
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build and Push Backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rr-dev-backend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./apps/v1-backend-flask
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags